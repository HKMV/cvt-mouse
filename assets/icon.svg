<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>CvtMouse</title>
  <!-- 底：深色圆角方块，跟界面主色（黑白）一套 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#0B0B0C"/>
  <!-- 鼠标：描边机身 + 按键分缝 + 滚轮 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="44">
    <rect x="140" y="252" width="340" height="520" rx="170"/>
    <path d="M140 470 H480"/>
  </g>
  <rect x="282" y="322" width="56" height="96" rx="28" fill="#FFFFFF"/>
  <!-- 三条错开的速度线：越往上越长越实，表示滚得快时一格顶好几格 -->
  <g fill="#FFFFFF">
    <rect x="556" y="352" width="268" height="48" rx="24"/>
    <rect x="592" y="480" width="192" height="48" rx="24" opacity="0.64"/>
    <rect x="628" y="608" width="116" height="48" rx="24" opacity="0.38"/>
  </g>
</svg>
