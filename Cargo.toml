[package]
name = "cvtmouse"
version = "0.1.5"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/HKMV/cvt-mouse"
description = "鼠标无级变速：滚轮按滚动速度自动加速、慢滚保持原生手感（指针变速在计划中）"

[workspace]

[build-dependencies]
# 把 app.rc 编成资源段（版本信息）塞进 exe；非 Windows 目标上它什么也不做
# （build.rs 里已经用 cfg 圈住了）。
embed-resource = "3"

[dependencies]
nsh-core = "0.7.2"
# 不要 `nsh-base`：本 crate 一次都没用到它（`src/` 里只碰 `nsh_core::prelude`），而它的
# 默认特性是 `editor` / `highlight` / `plot` / `rich-editor` / `term`——关掉 runner 的
# `highlight` 也没用，feature 统一会把 syntect + oniguruma + ropey + vte 一起拉进来
# （实测 exe 里 `onig` 有 137 处字符串）。宿主 crate 自己那份是 `default-features = false`，
# 只要本 crate 不再声明，nsh 的 `leave out` 才真正生效。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    # GetTickCount64 / GetLocalTime：钩子里的时间戳与日志的时间戳。
    "Win32_System_SystemInformation",
    # GetModuleFileNameW：提权重启时要知道自己在哪。
    "Win32_System_LibraryLoader",
    # ShellExecuteW("runas")。
    "Win32_UI_Shell",
    # SendInput / GetAsyncKeyState / RegisterHotKey。
    "Win32_UI_Input_KeyboardAndMouse",
    # 低级鼠标钩子、WindowFromPoint、SystemParametersInfoW、GetMessageW、EnumWindows。
    "Win32_UI_WindowsAndMessaging",
    # DwmSetWindowAttribute：去掉系统画在窗口外圈的那条 1px 描边。
    "Win32_Graphics_Dwm",
] }

# 发布版一切为了体积，编译时间让给 CI。
#
# 真正进用户手里那个 exe 是 nsh 的 runner，它在 `.nsh/rust` 那个 workspace 里编，
# 本 crate 只是它的一个成员——所以下面这块对**打包产物**不生效（cargo 会忽略成员
# 的 profile）。打包产物靠 `package.ps1` 里的 `CARGO_PROFILE_RELEASE_*` 环境变量，
# 值跟这里保持一致：opt-level=z / lto=fat / codegen-units=1 / strip=symbols /
# panic=abort。实测（同一份代码，只差 opt-level）：`z` 比 `s` 小 3.4 MB
# （runner 19.61 MB vs 22.99 MB），所以用 `z`。
#
# 放这里的用处只有一个：`cargo test --release` / `cargo build --release` 编本 crate
# 时用同一套条件，顺便给读的人一个明确声明。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# 注意：这条会让 `cargo test --release` 失效（测试框架需要展开）；`nsh test` 走
# dev profile，不受影响。
panic = "abort"
strip = "symbols"
